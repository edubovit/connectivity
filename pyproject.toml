[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "connectivity"
version = "1.0.0"
description = "Private, single-process connectivity monitoring"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["aiohttp==3.14.3", "PyYAML==6.0.3", "numpy==2.5.3"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "psutil==7.2.2", "cryptography==50.0.1"]

[project.scripts]
connectivity = "connectivity.__main__:main"

[tool.setuptools.package-data]
connectivity = ["static/*", "example.yml"]

[tool.setuptools.packages.find]
include = ["connectivity*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
